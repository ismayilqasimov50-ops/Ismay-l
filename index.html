<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İsmayıl Qasımov</title>
<style>
:root{
  --bg:#0f2a2e; --card:#f3efe6; --ink:#12302f; --muted:#5b6f6c; --accent:#e0a526;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0f2a2e}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 48px;
}
.photo{
  width:150px;height:150px;border-radius:50%;
  border:4px solid var(--accent);overflow:hidden;background:#1d4448;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{color:var(--card);font-size:1.9rem;margin:18px 0 28px;text-align:center;font-weight:900;letter-spacing:.5px}
.links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.link{
  display:flex;align-items:center;gap:16px;
  background:var(--card);color:var(--ink);text-decoration:none;
  border-radius:14px;padding:18px 20px;border-left:8px solid var(--c);
  transition:transform .15s ease;
}
.link:active{transform:scale(.98)}
.link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.link svg{width:34px;height:34px;flex-shrink:0;fill:var(--c)}
.link b{display:block;font-size:1.1rem}
.link span{display:block;font-size:.9rem;color:var(--muted);margin-top:2px;word-break:break-all}
.phone{--c:#1f7a5c}.wa{--c:#25a244}.ig{--c:#c13584}.tt{--c:#111}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0b1b2b}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.85;will-change:transform}
.bg i:nth-child(1){background:#ff3d81;top:-20vmax;left:-20vmax;animation:m1 3s ease-in-out infinite alternate}
.bg i:nth-child(2){background:#7a5cff;top:10vmax;right:-25vmax;animation:m2 3.5s ease-in-out infinite alternate}
.bg i:nth-child(3){background:#00d4c8;bottom:-25vmax;left:-10vmax;animation:m3 3.2s ease-in-out infinite alternate}
.bg i:nth-child(4){background:#ffb627;bottom:-20vmax;right:-20vmax;animation:m4 4s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(50vmax,40vmax) scale(1.2)}}
@keyframes m2{to{transform:translate(-55vmax,30vmax) scale(.9)}}
@keyframes m3{to{transform:translate(45vmax,-45vmax) scale(1.15)}}
@keyframes m4{to{transform:translate(-40vmax,-50vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
h1{text-shadow:0 2px 14px rgba(0,0,0,.45)}
.photo{box-shadow:0 8px 30px rgba(0,0,0,.35)}
.link{box-shadow:0 6px 20px rgba(0,0,0,.2)}
</style>
</head>
